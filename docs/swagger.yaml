securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: Authentication endpoints for user registration, login, and token management
  name: Auth
- description: User management endpoints (requires authentication)
  name: Users
- description: Role management endpoints (requires authentication and admin privileges)
  name: Roles
- description: Health check and monitoring endpoints
  name: Health
