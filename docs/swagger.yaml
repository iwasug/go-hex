basePath: /api/v1
definitions:
  golang-chi-hexagonal-base_internal_adapter_http_request.AssignRoleRequest:
    properties:
      role_id:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      permission_ids:
        items:
          type: string
        type: array
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.CreateSessionRequest:
    properties:
      session_name:
        type: string
      webhook_secret:
        type: string
      webhook_url:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.ForgotPasswordRequest:
    properties:
      email:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.RegisterRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.ResetPasswordRequest:
    properties:
      new_password:
        type: string
      token:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.SendTextMessageRequest:
    properties:
      content:
        description: Message content
        type: string
      to:
        description: Phone number in E.164 format
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_request.UpdateUserRequest:
    properties:
      email:
        type: string
      name:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.UserResponse'
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.BaseResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorDetail'
      message:
        type: string
      success:
        type: boolean
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.ErrorDetail:
    properties:
      code:
        type: string
      details:
        additionalProperties: true
        type: object
      message:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorDetail'
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.MessageSentResponse:
    properties:
      message:
        $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.WhatsAppMessageResponse'
      message_id:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.PaginatedResponse:
    properties:
      data: {}
      pagination:
        $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.Pagination'
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.Pagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.PairingCodeResponse:
    properties:
      expires_at:
        type: string
      pairing_code:
        type: string
      phone_number:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.PermissionResponse:
    properties:
      action:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      resource:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.QRCodeResponse:
    properties:
      expires_at:
        type: string
      qr_code:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.RefreshTokenResponse:
    properties:
      access_token:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.RoleResponse:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      description:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      name:
        type: string
      permissions:
        items:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.PermissionResponse'
        type: array
      updated_at:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.SessionStatusResponse:
    properties:
      connected_phone:
        type: string
      is_active:
        type: boolean
      is_connected:
        type: boolean
      is_logged_in:
        type: boolean
      last_activity:
        type: string
      phone_number:
        type: string
      session_id:
        type: string
      status:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.UserResponse:
    properties:
      created_at:
        type: string
      deleted_at:
        type: string
      email:
        type: string
      id:
        type: string
      is_deleted:
        type: boolean
      name:
        type: string
      roles:
        items:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.RoleResponse'
        type: array
      updated_at:
        type: string
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.WhatsAppMessageResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      direction:
        type: string
      error_message:
        type: string
      from:
        type: string
      id:
        type: string
      message_id:
        type: string
      message_type:
        type: string
      session_id:
        type: string
      status:
        type: string
      timestamp:
        type: string
      to:
        type: string
      updated_at:
        type: string
      webhook_attempts:
        type: integer
      webhook_delivered:
        type: boolean
    type: object
  golang-chi-hexagonal-base_internal_adapter_http_response.WhatsAppSessionResponse:
    properties:
      created_at:
        type: string
      device_info:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_activity:
        type: string
      phone_number:
        type: string
      qr_code:
        type: string
      qr_code_expiry:
        type: string
      session_name:
        type: string
      status:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
      webhook_url:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
    url: http://www.example.com/support
  description: Production-ready Go API using Chi router with Hexagonal Architecture
    (Ports and Adapters pattern). Features authentication, user management, and role-based
    access control (RBAC).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Go Hexagonal API
  version: "1.0"
paths:
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Send password reset token to user's email
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset email sent (if email exists)
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.BaseResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      summary: Request password reset
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email and password, returns access and refresh
        tokens
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.AuthResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Invalid credentials or user deleted
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidate refresh token and logout user
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.BaseResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      summary: Logout user
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Get a new access token using a valid refresh token
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: New access token
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.RefreshTokenResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account with email, password, and name
      parameters:
      - description: Registration request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User created successfully
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.UserResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "409":
          description: Email already exists
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      summary: Register a new user
      tags:
      - Auth
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Reset user password using reset token
      parameters:
      - description: Reset token and new password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password reset successful
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.BaseResponse'
        "400":
          description: Invalid or expired reset token
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      summary: Reset password
      tags:
      - Auth
  /roles:
    get:
      consumes:
      - application/json
      description: Get a list of roles with optional search, sorting, and filtering
      parameters:
      - description: Search by name or description
        in: query
        name: search
        type: string
      - description: Sort field (name, created_at)
        in: query
        name: order_by
        type: string
      - description: Sort direction (asc, desc)
        in: query
        name: order
        type: string
      - description: Include deleted roles (admin only)
        in: query
        name: include_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            items:
              $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.RoleResponse'
            type: array
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires roles:read permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List roles
      tags:
      - Roles
    post:
      consumes:
      - application/json
      description: Create a new role with specified permissions
      parameters:
      - description: Role creation data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Role created successfully
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.RoleResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires roles:write permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "409":
          description: Role with this name already exists
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create role
      tags:
      - Roles
  /roles/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a role (can be restored by admin)
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role deleted successfully
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.BaseResponse'
        "400":
          description: Invalid role ID
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires roles:delete permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "409":
          description: Role is in use and cannot be deleted
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete role
      tags:
      - Roles
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific role
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Role details
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.RoleResponse'
        "400":
          description: Invalid role ID
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires roles:read permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get role by ID
      tags:
      - Roles
    put:
      consumes:
      - application/json
      description: Update role information (name and description)
      parameters:
      - description: Role ID
        in: path
        name: id
        required: true
        type: string
      - description: Role update data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_request.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated role
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.RoleResponse'
        "400":
          description: Invalid input
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires roles:write permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "404":
          description: Role not found
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "409":
          description: Role with this name already exists
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update role
      tags:
      - Roles
  /users:
    get:
      consumes:
      - application/json
      description: Get a paginated list of users with optional search, sorting, and
        filtering
      parameters:
      - description: Search by name or email
        in: query
        name: search
        type: string
      - description: Sort field (name, email, created_at)
        in: query
        name: order_by
        type: string
      - description: Sort direction (asc, desc)
        in: query
        name: order
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      - description: Include deleted users (admin only)
        in: query
        name: include_deleted
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.PaginatedResponse'
        "400":
          description: Invalid parameters
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires users:read permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - Users
  /users/{id}:
    delete:
      consumes:
      - application/json
      description: Soft delete a user (can be restored by admin)
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User deleted successfully
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.BaseResponse'
        "400":
          description: Invalid user ID
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "403":
          description: Forbidden - requires users:delete permission
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/golang-chi-hexagonal-base_internal_adapter_http_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete user
      tags:
      - Users
    get:
      consumes:
      - application/json
      description: Retrieve detailed information about a specific user
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
