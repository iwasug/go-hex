run:
  timeout: 5m
  tests: true
  skip-dirs:
    - bin
    - vendor
    - migrations

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - gocritic
    - revive
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - exportloopref

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
  
  govet:
    check-shadowing: true
  
  gofmt:
    simplify: true
  
  gocritic:
    enabled-checks:
      - nestingReduce
      - unnamedResult
      - ruleguard
      - truncateCmp
  
  revive:
    confidence: 0.8
    rules:
      - name: var-naming
      - name: indent-error-flow
      - name: errorf
      - name: error-return
      - name: error-strings
      - name: error-naming
  
  gosec:
    excludes:
      - G401
      - G501

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
